    uploadedPaths=[];assertCurrent();invalidateLedger();S.draftDirty=false;S.draftWriteId=null;
    if(closeAfterSave){S.ledgerRequested=true;closeOverlay('recordOverlay',false,true)}else{S.entryVersion++;S.editing=null;$('recordTitle').textContent='记一笔';for(let id of ['rIncome','rExpense','rSummary','rPartner','rCategory','rRemark','rImages'])$(id).value='';$('rPartner').dataset.manual='';$('rCategory').dataset.manual='';setImageStatus('');if(matchMedia('(min-width:761px)').matches)setTimeout(()=>{$('rIncome').focus()},50)}toast('已保存');
  }catch(e){if(epoch!==S.authEpoch||owner!==S.user?.id)return;uploadedPaths=e.uploadedPaths||uploadedPaths;
    // A missing acknowledgement is not proof of a failed write. Never auto-retry
    // or delete receipts that a committed record may already reference.
    if(!writeStarted&&uploadedPaths.length){try{await db.storage.from('receipts').remove(uploadedPaths)}catch{}}
    setImageStatus(writeStarted?'未确认保存结果，请先查看账本核对，勿重复新建；本页内容已保留。':'图片处理或上传失败，本页内容已保留，请重试。','error');toast(writeStarted?'未确认保存结果，请先核对账本':'保存失败：'+(e.message||'未知错误'));
  }finally{S.saving=false;updateAuth();scheduleLedgerPreload()}
}
function pauseLedgerReads(){clearTimeout(S.backgroundTimer);S.recordsRequestId++;S.summaryRequestId++;S.recordsAbort?.abort();S.summaryAbort?.abort();S.ledgerLoaded=false}

async function remove(id){if(!S.user)return openOverlay('loginOverlay');if(!confirm('确定删除这条记录吗？此操作不可撤销。'))return;try{let {error}=await db.from('cash_records').delete().eq('id',id);if(error)throw error;invalidateLedger();toast('已删除');void refresh()}catch{toast('删除失败，请检查网络后重试')}}
async function exportMonth(){
  if(!S.user)return openOverlay('loginOverlay');if(S.exporting)return;S.exporting=true;updateAuth();let b=bounds(),epoch=S.authEpoch,all=[],page=0;toast('正在准备完整月度数据…');
  try{let [XLSX,summaryResult]=await Promise.all([loadScript('./vendor/xlsx-0.18.5.js','XLSX'),db.rpc('cash_month_summary',{p_year:b.y,p_month:b.m})]);if(summaryResult.error)throw summaryResult.error;
    while(true){if(epoch!==S.authEpoch)return;let {data,error}=await db.from('cash_records').select('id,date,time,type,amount,summary,remark,partner,category,created_at').gte('date',b.start).lt('date',b.end).order('date').order('created_at').order('id').range(page*1000,(page+1)*1000-1);if(error)throw error;all.push(...(data||[]));if(!data||data.length<1000)break;page++}
    if(epoch!==S.authEpoch)return;let running=Number(summaryResult.data?.[0]?.opening_balance||0),rows=[];for(let r of all){if(marker(r.summary))continue;running+=r.type==='income'?+r.amount:-r.amount;rows.push({日期:r.date,时间:timeOf(r),类型:r.type==='income'?'收入':'支出',摘要:r.summary,往来单位:r.partner||'',分类:r.category||'',备注:r.remark||'',收入:r.type==='income'?r.amount:0,支出:r.type==='expense'?r.amount:0,余额:running})}if(!rows.length)return toast('本月没有可导出记录');let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'出纳日记账');XLSX.writeFile(wb,`出纳日记账_${b.y}-${String(b.m).padStart(2,'0')}.xlsx`)
  }catch{toast('导出失败，请检查网络后重试')}finally{S.exporting=false;updateAuth()}
}
async function auth(){
  if($('doLoginBtn').disabled)return;$('doLoginBtn').disabled=true;
  let previous=S.draftOwnerId||S.sessionOwnerId;S.manualLogin=true;S.identityVersion++;resetPrivateView();S.sessionOwnerId=null;let run=S.authCheckId;S.authPending=true;S.authState='checking';updateAuth();
  try{await ensureClient();previous ||= S.sessionOwnerId;let email=$('email').value.trim(),password=$('password').value;let {data,error}=await db.auth.signInWithPassword({email,password});if(run!==S.authCheckId)return;if(error)throw error;if(S.sessionOwnerId&&S.sessionOwnerId!==data.user.id){S.identityVersion++;resetPrivateView(true);S.authState='error';toast('账号状态发生变化，请重新核验');return}previous ||= S.draftOwnerId;if(previous&&previous!==data.user.id)resetPrivateView(true);S.user=data.user;S.sessionOwnerId=data.user.id;S.draftOwnerId=data.user.id;S.authState='ready';$('password').value='';closeOverlay('loginOverlay');autoOpenNewRecordOnPhone();toast('登录成功，请确认后保存')}
  catch(error){if(run===S.authCheckId){S.authState=error.status>=400&&error.status<500?'signedout':'error';toast(error.message||'登录失败，请重试')}}
  finally{S.manualLogin=false;cancelPendingSave();S.authPending=false;$('doLoginBtn').disabled=false;updateAuth();scheduleLedgerPreload()}
}
async function sendReset(){let email=$('email').value.trim();if(!email)return toast('请先输入登录邮箱');try{await ensureClient();let {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:'https://shixing226.github.io/cash-journal/?reset=1'});if(error)throw error;toast('重设邮件已发送，请打开邮箱中的链接')}catch{toast('发送失败，请稍后重试')}}
async function savePassword(){let p=$('newPassword').value,c=$('confirmPassword').value;if(p.length<8)return toast('新密码至少 8 位');if(p!==c)return toast('两次密码不一致');try{await ensureClient();let {error}=await db.auth.updateUser({password:p});if(error)throw error;closeOverlay('resetOverlay');$('newPassword').value='';$('confirmPassword').value='';history.replaceState({},'',location.pathname);autoOpenNewRecordOnPhone();toast('新密码已设置')}catch{toast('保存失败，请稍后重试')}}
function updateAuth(){
  let waiting=!!S.pendingSave,busy=waiting||S.saving;
  $('loginBtn').textContent=S.user?(S.user.email||'已登录'):'登录';
  $('entryStatus').textContent=S.saving?'正在提交，请等待保存成功后再离开…':waiting?'等待登录核验，通过后自动保存一次。尚未保存，请勿关闭网页。':S.authPending?'可以先填写；填完点保存，核验通过后会自动提交。':S.user?'':S.authState==='error'?'网络核验暂未完成，内容已保留；请重试，不必重新填写。':'登录已失效或尚未登录，内容已保留；请先登录再保存。';
  $('saveBtn').disabled=$('saveNextBtn').disabled=busy;$('saveBtn').textContent=S.saving?'保存中…':waiting?'等待核验…':'保存';
  $('entryRetryBtn').hidden=S.authPending||!!S.user||S.saving||S.authState!=='error';$('entryLoginBtn').hidden=S.authPending||!!S.user||S.saving;$('cancelPendingBtn').hidden=!waiting;
  $('entryActions').hidden=[...$('entryActions').children].every(el=>el.hidden);
  document.querySelectorAll('#recordOverlay .grid input,#recordOverlay .grid textarea').forEach(el=>el.disabled=busy);
  document.querySelectorAll('[data-close="recordOverlay"]').forEach(el=>el.disabled=S.saving);
  $('exportBtn').disabled=S.authPending||S.exporting||!S.user;
  if(S.user)dataStatus();else if(S.authState==='error'){$('dataStatus').textContent='登录核验未完成，请重试';$('retryBtn').hidden=false}
}
function verifiedUserRequest(){
  // Reuse an unfinished check on network retry instead of piling up SDK lock waiters.
  if(authUserRequest?.identity===S.identityVersion)return authUserRequest.promise;
  const request={identity:S.identityVersion};request.promise=ensureClient().then(()=>db.auth.getUser()).finally(()=>{if(authUserRequest===request)authUserRequest=null});authUserRequest=request;return request.promise;
}
function checkAuth(){
  if(S.manualLogin)return;if(authPromise)return authPromise;
  let epoch=S.authEpoch,run=++S.authCheckId;S.authPending=true;S.authState='checking';updateAuth();$('retryBtn').hidden=true;
  const task=(async()=>{let timer;try{
    let {data,error}=await Promise.race([verifiedUserRequest(),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('登录检查超时')),15000)})]);
    if(epoch!==S.authEpoch||run!==S.authCheckId)return;
    if(error&&error.name!=='AuthSessionMissingError')throw error;
    if(!data?.user){resetPrivateView();S.authPending=false;S.authState='signedout';updateAuth();return}
    if((S.sessionOwnerId&&S.sessionOwnerId!==data.user.id)||(S.draftOwnerId&&S.draftOwnerId!==data.user.id)){S.identityVersion++;resetPrivateView(true);S.authPending=false;S.authState='error';updateAuth();return}
    S.user=data.user;S.sessionOwnerId=data.user.id;S.draftOwnerId=data.user.id;S.authPending=false;S.authState='ready';updateAuth();void consumePendingSave();scheduleLedgerPreload();
  }catch(error){if(epoch!==S.authEpoch||run!==S.authCheckId)return;resetPrivateView();S.authPending=false;S.authState=error.status===401||error.status===403?'signedout':'error';updateAuth()}
  finally{clearTimeout(timer);if(authPromise===task)authPromise=null}})();authPromise=task;return task;
}
