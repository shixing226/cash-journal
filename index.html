<html lang="zh-CN">
<head>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{--brand:#5e9ca0;--brand-dark:#36787c;--brand-soft:#e8f4f3;--ink:#243436;--muted:#718082;--line:#dce8e7;--paper:#ffffff;--bg:#f5f8f8;--income:#6eaa55;--expense:#dc7474;--shadow:0 14px 36px rgba(42,73,74,.09);--radius:18px}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 100% 0,#e9f5f3 0,transparent 33%),linear-gradient(135deg,#f8fafb,#f1f6f5);color:var(--ink);font:14px/1.5 "Microsoft YaHei",system-ui,-apple-system,sans-serif}
    button,input,select,textarea{font:inherit}.app{max-width:1240px;margin:auto;padding:30px 24px 42px}.top,.toolbar,.stats,.pager,.modal-head,.modal-actions{display:flex;align-items:center;gap:12px}
    .top{justify-content:space-between;margin:4px 0 24px}.title{font-size:28px;letter-spacing:-.7px;font-weight:800;display:flex;align-items:center;gap:8px}.title:before{content:"";width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--brand),#8bc3c0);box-shadow:0 7px 15px #5e9ca044}.sub{margin:4px 0 0 45px;color:var(--muted);font-size:12px;letter-spacing:.2px}.actions{display:flex;gap:9px;flex-wrap:wrap}
    button{border:0;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:600;transition:.18s ease}button:hover{transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.primary{background:linear-gradient(135deg,var(--brand),#78b7b4);color:#fff;box-shadow:0 7px 15px #5e9ca03d}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:0 2px 5px #264b4b08}.danger{color:var(--expense)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#fff,#fbfdfd);border:1px solid #e0eceb;border-radius:var(--radius);padding:18px 19px;box-shadow:var(--shadow)}.card:after{content:"";position:absolute;inset:auto -22px -25px auto;width:70px;height:70px;border-radius:50%;background:var(--brand-soft);opacity:.6}.card:nth-child(2):after{background:#edf7e9}.card:nth-child(3):after{background:#fff0ef}.label{position:relative;z-index:1;color:var(--muted);font-size:12px}.value{position:relative;z-index:1;font-size:24px;font-weight:800;margin-top:5px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}.income{color:var(--income)}.expense{color:var(--expense)}
    .toolbar{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;flex-wrap:wrap;box-shadow:0 8px 22px #274c4c08}.toolbar input{flex:1;min-width:200px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid #d8e5e4;border-radius:11px;padding:10px 11px;background:#fff;outline:none;transition:.18s}.toolbar input:focus,.toolbar select:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px #5e9ca020}.seg{display:flex;background:var(--brand-soft);padding:3px;border-radius:12px}.seg button{padding:7px 12px;background:transparent;color:#587071}.seg button.active{background:#fff;color:var(--brand-dark);box-shadow:0 2px 8px #285a5a1c}
    .tablebox{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow)}table{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}th,td{padding:13px 12px;border-bottom:1px solid #edf3f2;text-align:left}th{position:sticky;top:0;z-index:2;background:#f5faf9;color:#6f8383;font-size:12px;font-weight:700;letter-spacing:.2px}tbody tr{transition:.15s}tbody tr:hover{background:#f5fbfa}tbody tr:last-child td{border-bottom:0}.num{text-align:right;font-variant-numeric:tabular-nums}.summary{font-weight:700;color:#233739}.meta{color:var(--muted);font-size:12px}.tag{display:inline-block;background:var(--brand-soft);color:var(--brand-dark);border-radius:999px;padding:2px 8px;margin:4px 4px 0 0;font-size:12px}.attachment{color:var(--brand-dark);background:none;padding:3px 0;font-size:12px}.empty{text-align:center;padding:60px;color:var(--muted)}
    .pager{justify-content:space-between;padding:13px 14px;background:#fbfdfd}.status{position:fixed;right:20px;top:20px;background:#294d4e;color:#fff;padding:11px 15px;border-radius:12px;z-index:99;box-shadow:0 10px 24px #16353633}
    .overlay{display:none;position:fixed;inset:0;background:#17333488;backdrop-filter:blur(3px);z-index:90;padding:20px;align-items:center;justify-content:center}.overlay.show{display:flex}.modal{background:#fff;border-radius:22px;width:min(620px,100%);max-height:92vh;overflow:auto;padding:22px;box-shadow:0 22px 65px #13292940}.modal-head{justify-content:space-between;border-bottom:1px solid #edf2f1;padding-bottom:12px}.modal-head h2{margin:0;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-weight:600;color:#4a5f60}.field.full{grid-column:1/-1}.hint{font-size:12px;color:var(--muted);font-weight:400}.modal-actions{justify-content:flex-end;margin-top:19px}.quick-save{font-size:12px;color:var(--muted);margin-right:auto;font-weight:400}
    .images{display:block}.proof-stage{display:flex;flex-direction:column;align-items:center;gap:12px}.proof-stage img{width:100%;height:min(72vh,820px);object-fit:contain;background:#162525;border-radius:13px}.proof-controls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.proof-link{color:var(--brand-dark);text-decoration:none;padding:8px 10px;font-weight:600}.loading{opacity:.55;pointer-events:none}.image-status{margin-top:8px;color:var(--muted);font-size:12px;font-weight:400;min-height:18px}.image-status.error{color:#b94f4f}.image-status.busy{color:var(--brand-dark)}body.modal-open{overflow:hidden}
    @media(max-width:760px){body{background:#f5f8f8}.app{padding:18px 12px calc(30px + env(safe-area-inset-bottom))}.top{display:block;margin:0 0 17px}.title{font-size:23px;white-space:nowrap}.title:before{width:31px;height:31px;border-radius:10px}.sub{margin-left:39px}.actions{justify-content:flex-start;gap:6px;margin-top:12px}.actions button{padding:10px;font-size:13px;min-height:42px}.stats{grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.card{padding:14px 13px;border-radius:14px}.value{font-size:18px}.toolbar{padding:10px;border-radius:14px;gap:8px}.toolbar input{order:3;flex-basis:100%;min-width:100%}.toolbar select{padding:10px 8px;min-height:44px}.seg button{padding:8px 10px;min-height:40px}.tablebox{border-radius:14px}.overlay{padding:0;align-items:stretch;top:var(--vv-top,0px);bottom:auto;height:var(--vv-height,100dvh)}.modal{display:flex;flex-direction:column;width:100%;height:100%;max-height:none;border-radius:0;padding:0;overflow:hidden}.modal-head{flex:0 0 auto;z-index:3;background:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}.grid{display:block;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 16px 20px;-webkit-overflow-scrolling:touch}.field.full{grid-column:auto}.field input,.field select,.field textarea{font-size:16px;padding:12px;min-height:46px}.field textarea{min-height:78px}.field input[type=file]{height:auto;min-height:50px}.modal-actions{position:static;flex:0 0 auto;z-index:5;margin:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));gap:7px;box-shadow:0 -8px 20px #18363712}.modal-actions button{padding:11px 9px;min-height:44px;flex:1;white-space:nowrap}.modal-actions .ghost{flex:0 0 auto}.quick-save{display:none}.proof-stage{padding:12px 16px}.proof-stage img{height:calc(var(--vv-height,100dvh) - 190px)}.status{left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));text-align:center}}
    @media(max-height:520px){.overlay{padding:0;align-items:stretch;top:var(--vv-top,0px);bottom:auto;height:var(--vv-height,100dvh)}.modal{display:flex;flex-direction:column;width:100%;height:100%;max-height:none;border-radius:0;padding:0;overflow:hidden}.modal-head{flex:0 0 auto;background:#fff;padding:8px 16px}.grid{display:block;flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 16px 12px;-webkit-overflow-scrolling:touch}.field input,.field select,.field textarea{font-size:16px}.modal-actions{position:static;flex:0 0 auto;margin:0;background:#fff;border-top:1px solid var(--line);padding:7px 12px calc(7px + env(safe-area-inset-bottom));gap:7px}.modal-actions button{min-height:42px;flex:1}.quick-save{display:none}}
  </style>
</head>
<body>
<main class="app">
  <header class="top">
    <div><div class="title">出纳日记账 <span class="tag">V2</span></div><div class="sub">自动结转 · 全历史搜索 · 图片按需加载</div></div>
    <div class="actions"><button class="ghost" id="loginBtn">登录</button><button class="ghost" id="exportBtn">导出本月</button><button class="primary" id="addBtn">＋ 记一笔</button></div>
  </header>
  <section class="stats">
    <div class="card"><div class="label">期初余额</div><div class="value" id="opening">¥0.00</div></div>
    <div class="card"><div class="label">本月收入</div><div class="value income" id="income">¥0.00</div></div>
    <div class="card"><div class="label">本月支出</div><div class="value expense" id="expense">¥0.00</div></div>
    <div class="card"><div class="label">期末余额</div><div class="value" id="closing">¥0.00</div></div>
  </section>
  <section class="toolbar">
    <select id="year"></select><select id="month"></select>
    <div class="seg" id="typeSeg"><button class="active" data-type="all">全部</button><button data-type="income">收入</button><button data-type="expense">支出</button></div>
    <input id="search" type="search" name="ledger-search" autocomplete="off" spellcheck="false" readonly onfocus="this.removeAttribute('readonly')" placeholder="搜索摘要、备注、单位、分类或金额">
    <div class="seg" id="scopeSeg"><button class="active" data-scope="month">本月</button><button data-scope="all">全部历史</button></div>
  </section>
  <section class="tablebox">
    <table><thead><tr><th>日期/时间</th><th>类型</th><th>摘要</th><th class="num">收入</th><th class="num">支出</th><th class="num">余额</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table>
    <div class="empty" id="empty">正在加载…</div>
    <div class="pager"><span id="resultInfo"></span><div><button class="ghost" id="prev">上一页</button> <button class="ghost" id="next">下一页</button></div></div>
  </section>
</main>
<div class="overlay" id="recordOverlay"><div class="modal">
  <div class="modal-head"><h2 id="recordTitle">记一笔</h2><button class="ghost" data-close="recordOverlay">关闭</button></div>
  <div class="grid">
    <label class="field"><span>日期</span><input type="date" id="rDate"></label>
    <label class="field"><span>收入金额</span><input type="number" inputmode="decimal" min="0" step=".01" id="rIncome" placeholder="0.00"></label>
    <label class="field"><span>支出金额</span><input type="number" inputmode="decimal" min="0" step=".01" id="rExpense" placeholder="0.00"></label>
    <label class="field"><span>摘要</span><input id="rSummary" placeholder="照平时习惯填写"></label>
    <label class="field"><span>往来单位（自动建议，可修改）</span><input id="rPartner"></label>
    <label class="field"><span>收支分类（自动建议，可修改）</span><input id="rCategory"></label>
    <label class="field full"><span>备注</span><textarea id="rRemark" rows="2"></textarea></label>
    <label class="field full"><span>图片凭证</span><input type="file" id="rImages" accept="image/jpeg,image/png,image/webp" multiple><span class="hint">最多 6 张，每张不超过 15MB；会自动压缩。编辑时不选图片会保留原图片，重新选择则替换。</span><span class="image-status" id="imageStatus" aria-live="polite"></span></label>
  </div>
  <div class="modal-actions"><span class="quick-save">按 Enter：保存并继续录入</span><button class="ghost" data-close="recordOverlay">取消</button><button class="primary" id="saveBtn">保存</button><button class="primary" id="saveNextBtn">保存并继续</button></div>
</div></div>
<div class="overlay" id="loginOverlay"><div class="modal" style="max-width:420px">
  <div class="modal-head"><h2>登录</h2><button class="ghost" data-close="loginOverlay">关闭</button></div>
  <label class="field"><span>邮箱</span><input type="email" id="email"></label><label class="field"><span>密码</span><input type="password" id="password"></label>
  <div class="modal-actions"><button class="ghost" id="forgotBtn">忘记密码</button><button class="primary" id="doLoginBtn">登录</button></div>
</div></div>
<div class="overlay" id="resetOverlay"><div class="modal" style="max-width:420px">
  <div class="modal-head"><h2>设置新密码</h2></div>
  <label class="field"><span>新密码（至少 8 位）</span><input type="password" id="newPassword"></label><label class="field"><span>再输入一次</span><input type="password" id="confirmPassword"></label>
  <div class="modal-actions"><button class="primary" id="savePasswordBtn">保存新密码</button></div>
</div></div>
<div class="overlay" id="imageOverlay"><div class="modal" style="width:min(1000px,100%)"><div class="modal-head"><h2>图片凭证</h2><button class="ghost" data-close="imageOverlay">关闭</button></div><div class="images" id="imageList"></div></div></div>
<script>
const SUPABASE_URL='https://vgmqdvvuekfzbagjpjid.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnbXFkdnZ1ZWtmemJhZ2pwamlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0ODk2NTksImV4cCI6MjA5MDA2NTY1OX0.Mfl22ZdkGAKYJTaVQ8S-U7tezviz6tS-FLFCdNkX3qM';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const S={records:[],rules:[],scope:'month',type:'all',page:0,pageSize:500,total:0,summary:null,user:null,editing:null,timer:null,imageUrls:[],imageIndex:0,saving:false};
const $=id=>document.getElementById(id), money=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const MAX_IMAGES=6,MAX_SOURCE_BYTES=15*1024*1024,MAX_UPLOAD_BYTES=3*1024*1024,ALLOWED_IMAGE_TYPES=new Set(['image/jpeg','image/png','image/webp']);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const marker=s=>['上月余额','上月结余','期初余额','上月余款'].includes(String(s||'').replace(/\s/g,''));
function toast(t){document.querySelector('.status')?.remove();let d=document.createElement('div');d.className='status';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2400)}
function bounds(){let y=+$('year').value,m=+$('month').value;return {y,m,start:`${y}-${String(m).padStart(2,'0')}-01`,end:m===12?`${y+1}-01-01`:`${y}-${String(m+1).padStart(2,'0')}-01`}}
function parseImages(v){if(!v)return[];try{let x=JSON.parse(v);return Array.isArray(x)?x:[x]}catch{return String(v).split(',').map(x=>x.trim()).filter(Boolean)}}
function showProofImage(index){if(!S.imageUrls.length)return;S.imageIndex=(index+S.imageUrls.length)%S.imageUrls.length;let url=S.imageUrls[S.imageIndex];$('imageList').innerHTML=`<div class="proof-stage"><img src="${esc(url)}" alt="凭证 ${S.imageIndex+1}"><div class="proof-controls"><button class="ghost" onclick="showProofImage(${S.imageIndex-1})" ${S.imageUrls.length===1?'disabled':''}>上一张</button><span>${S.imageIndex+1} / ${S.imageUrls.length}</span><button class="ghost" onclick="showProofImage(${S.imageIndex+1})" ${S.imageUrls.length===1?'disabled':''}>下一张</button><a class="proof-link" href="${esc(url)}" target="_blank" rel="noopener">在新标签打开原图 ↗</a></div></div>`}
function timeOf(r){try{let t=JSON.parse(r.time||'{}');return `${String(t.hour||0).padStart(2,'0')}:${String(t.minute||0).padStart(2,'0')}`}catch{return String(r.time||'').slice(0,5)}}
function suggest(text){let x=String(text||'').toLowerCase(),out={partner:'',category:''};for(let r of S.rules){if(r.enabled===false||!x.includes(String(r.keyword).toLowerCase()))continue;if(!out.partner&&r.partner)out.partner=r.partner;if(!out.category&&r.category)out.category=r.category;if(out.partner&&out.category)break}return out}
async function loadRules(){let {data}=await db.from('cash_classification_rules').select('*').eq('enabled',true).order('priority');S.rules=data||[]}
async function loadSummary(){
  let {y,m}=bounds(),{data,error}=await db.rpc('cash_month_summary',{p_year:y,p_month:m});
  if(error){toast('请先执行数据库升级脚本');S.summary={opening_balance:0,total_income:0,total_expense:0,closing_balance:0}}
  else S.summary=data?.[0]||{};
  $('opening').textContent=money(S.summary.opening_balance);$('income').textContent=money(S.summary.total_income);$('expense').textContent=money(S.summary.total_expense);$('closing').textContent=money(S.summary.closing_balance);if(S.records.length)render();
}
async function loadRecords(){
  $('empty').style.display='block';$('empty').textContent='正在加载…';let q=db.from('cash_records').select('id,date,time,type,amount,summary,remark,image_url,partner,category,created_at',{count:'exact'});
  let term=$('search').value.trim(),b=bounds();if(S.scope==='month')q=q.gte('date',b.start).lt('date',b.end);
  if(S.type!=='all')q=q.eq('type',S.type);
  if(term){let safe=term.replace(/[,%()]/g,' '),amountTerm=term.replace(/[¥￥,\s]/g,'');let filters=[`summary.ilike.%${safe}%`,`remark.ilike.%${safe}%`,`partner.ilike.%${safe}%`,`category.ilike.%${safe}%`];if(/^\d+(\.\d{1,2})?$/.test(amountTerm))filters.push(`amount.eq.${amountTerm}`);q=q.or(filters.join(','))}
  let from=S.page*S.pageSize,{data,error,count}=await q.order('date',{ascending:false}).order('created_at',{ascending:false}).range(from,from+S.pageSize-1);
  if(error){toast('加载失败：'+error.message);S.records=[];S.total=0}else{S.records=data||[];S.total=count||0}render()
}
function render(){
  let opening=Number(S.summary?.opening_balance||0),running=opening;
  let asc=[...S.records].sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  if(S.scope==='month'&&!$('search').value.trim()&&S.page===0)for(let r of asc){if(marker(r.summary))continue;running+=r.type==='income'?+r.amount:-r.amount;r._balance=running}
  $('rows').innerHTML=S.records.map(r=>{let imgs=parseImages(r.image_url),sg=suggest(r.summary),p=r.partner||sg.partner,c=r.category||sg.category;return `<tr>
    <td>${esc(r.date)}<div class="meta">${esc(timeOf(r))}</div></td><td class="${r.type}">${r.type==='income'?'收入':'支出'}${marker(r.summary)?'<div class="tag">期初基准</div>':''}</td>
    <td><div class="summary">${esc(r.summary)}</div>${r.remark?`<div class="meta">${esc(r.remark)}</div>`:''}${p?`<span class="tag">${esc(p)}</span>`:''}${c?`<span class="tag">${esc(c)}</span>`:''}${imgs.length?`<button class="attachment" data-images="${esc(JSON.stringify(imgs))}">📎 ${imgs.length} 张凭证</button>`:''}</td>
    <td class="num income">${r.type==='income'&&!marker(r.summary)?money(r.amount):'-'}</td><td class="num expense">${r.type==='expense'?money(r.amount):'-'}</td><td class="num">${r._balance==null?'—':money(r._balance)}</td>
    <td><button class="ghost edit" data-id="${esc(r.id)}">编辑</button> <button class="ghost danger del" data-id="${esc(r.id)}">删除</button></td></tr>`}).join('');
  $('empty').style.display=S.records.length?'none':'block';$('empty').textContent='没有找到记录';$('resultInfo').textContent=`共 ${S.total} 条 · 第 ${S.page+1} 页`;$('prev').disabled=S.page===0;$('next').disabled=(S.page+1)*S.pageSize>=S.total
}
async function refresh(){await Promise.all([loadSummary(),loadRecords()])}
function setImageStatus(text='',kind=''){$('imageStatus').textContent=text;$('imageStatus').className='image-status'+(kind?' '+kind:'')}
function openOverlay(id){$(id).classList.add('show');document.body.classList.add('modal-open');syncVisualViewport()}
function closeOverlay(id){$(id).classList.remove('show');if(!document.querySelector('.overlay.show'))document.body.classList.remove('modal-open')}
function syncVisualViewport(){let vv=window.visualViewport,h=vv?.height||window.innerHeight,top=vv?.offsetTop||0;document.documentElement.style.setProperty('--vv-height',`${Math.round(h)}px`);document.documentElement.style.setProperty('--vv-top',`${Math.round(top)}px`)}
function keepFocusedFieldVisible(){let el=document.activeElement;if(!el?.closest('.modal'))return;setTimeout(()=>el.scrollIntoView({block:'center',behavior:'smooth'}),80)}
function openRecord(r=null){S.editing=r;$('rPartner').dataset.manual='';$('rCategory').dataset.manual='';$('recordTitle').textContent=r?'编辑记录':'记一笔';$('rDate').value=r?.date||new Date().toISOString().slice(0,10);$('rIncome').value=r?.type==='income'?r.amount:'';$('rExpense').value=r?.type==='expense'?r.amount:'';$('rSummary').value=r?.summary||'';$('rPartner').value=r?.partner||'';$('rCategory').value=r?.category||'';$('rRemark').value=r?.remark||'';$('rImages').value='';setImageStatus('');openOverlay('recordOverlay');if(matchMedia('(min-width:761px)').matches)setTimeout(()=>{$('rIncome').focus()},80)}
function autoOpenNewRecordOnPhone(){if(S.user&&matchMedia('(max-width:760px) and (pointer:coarse)').matches&&!document.querySelector('.overlay.show'))openRecord()}
async function decodeImage(file){if('createImageBitmap'in window){try{return await createImageBitmap(file,{imageOrientation:'from-image'})}catch{}}return await new Promise((resolve,reject)=>{let url=URL.createObjectURL(file),img=new Image;img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error(`无法读取图片“${file.name}”，请改用 JPG、PNG 或 WebP`))};img.src=url})}
async function compress(file){if(!ALLOWED_IMAGE_TYPES.has(file.type))throw new Error(`不支持“${file.name}”的格式，请选择 JPG、PNG 或 WebP`);if(file.size>MAX_SOURCE_BYTES)throw new Error(`“${file.name}”超过 15MB，请先裁剪后再上传`);let source=await decodeImage(file);try{let width=source.width,height=source.height,make=async(maxSide,quality)=>{let scale=Math.min(1,maxSide/Math.max(width,height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(width*scale));cv.height=Math.max(1,Math.round(height*scale));let ctx=cv.getContext('2d',{alpha:false});if(!ctx)throw new Error('当前浏览器无法处理图片');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(source,0,0,cv.width,cv.height);return await new Promise(resolve=>cv.toBlob(resolve,'image/jpeg',quality))};let blob=await make(1600,.72);if(!blob)throw new Error(`压缩“${file.name}”失败`);if(blob.size>MAX_UPLOAD_BYTES)blob=await make(1280,.62);if(!blob||blob.size>MAX_UPLOAD_BYTES)throw new Error(`“${file.name}”压缩后仍超过 3MB，请先裁剪后重试`);return new File([blob],file.name.replace(/\.[^.]+$/,'.jpg'),{type:'image/jpeg',lastModified:Date.now()})}finally{source.close?.()}}
async function prepareFiles(){let files=[...$('rImages').files];if(files.length>MAX_IMAGES)throw new Error(`一次最多上传 ${MAX_IMAGES} 张图片`);let prepared=[];for(let i=0;i<files.length;i++){setImageStatus(`正在处理第 ${i+1}/${files.length} 张：${files[i].name}`,'busy');prepared.push(await compress(files[i]))}return prepared}
function uniqueId(){return crypto.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`}
async function uploadFiles(){let files=await prepareFiles(),urls=[],paths=[];for(let i=0;i<files.length;i++){let file=files[i],name=`${new Date().toISOString().slice(0,10)}/${uniqueId()}.jpg`;setImageStatus(`正在上传第 ${i+1}/${files.length} 张…`,'busy');let {error}=await db.storage.from('receipts').upload(name,file,{contentType:'image/jpeg',upsert:false});if(error){error.uploadedPaths=paths;throw error}paths.push(name);urls.push(db.storage.from('receipts').getPublicUrl(name).data.publicUrl)}return {urls,paths}}
async function save(closeAfterSave=true){
  if(S.saving)return;if(!S.user)return openOverlay('loginOverlay');let date=$('rDate').value,income=+$('rIncome').value||0,expense=+$('rExpense').value||0,summary=$('rSummary').value.trim();if(!date||!summary)return toast('请填写日期和摘要');if(income<=0&&expense<=0)return toast('请填写收入或支出金额');if(income>0&&expense>0)return toast('一笔记录只能填写收入或支出其中一个金额');let type=income>0?'income':'expense',amount=income>0?income:expense,uploadedPaths=[];
  S.saving=true;$('saveBtn').disabled=true;$('saveNextBtn').disabled=true;$('saveBtn').textContent='保存中…';try{let uploaded=await uploadFiles();uploadedPaths=uploaded.paths;let fresh=uploaded.urls,old=S.editing?parseImages(S.editing.image_url):[],now=new Date(),row={date,amount,summary,type,partner:$('rPartner').value.trim()||null,category:$('rCategory').value.trim()||null,remark:$('rRemark').value.trim(),image_url:JSON.stringify(fresh.length?fresh:old),time:S.editing?.time||JSON.stringify({hour:now.getHours(),minute:now.getMinutes()})};
    let q=S.editing?db.from('cash_records').update(row).eq('id',S.editing.id):db.from('cash_records').insert({...row,id:`id_${Date.now()}_${Math.random().toString(36).slice(2,10)}`});let {error}=await q;if(error)throw error;uploadedPaths=[];if(closeAfterSave){closeOverlay('recordOverlay')}else{S.editing=null;$('recordTitle').textContent='记一笔';$('rIncome').value='';$('rExpense').value='';$('rSummary').value='';$('rPartner').value='';$('rCategory').value='';$('rRemark').value='';$('rImages').value='';$('rPartner').dataset.manual='';$('rCategory').dataset.manual='';setImageStatus('');if(matchMedia('(min-width:761px)').matches)setTimeout(()=>{$('rIncome').focus()},50)}toast('已保存');await refresh()
  }catch(e){uploadedPaths=e.uploadedPaths||uploadedPaths;if(uploadedPaths.length){try{await db.storage.from('receipts').remove(uploadedPaths)}catch{}}setImageStatus('上传或保存失败，图片未写入账目，请检查网络后重试。','error');toast('保存失败：'+(e.message||'未知错误'))}finally{S.saving=false;$('saveBtn').disabled=false;$('saveNextBtn').disabled=false;$('saveBtn').textContent='保存'}
}
async function remove(id){if(!S.user)return $('loginOverlay').classList.add('show');if(!confirm('确定删除这条记录吗？此操作不可撤销。'))return;let {error}=await db.from('cash_records').delete().eq('id',id);if(error)toast('删除失败：'+error.message);else{toast('已删除');await refresh()}}
async function exportMonth(){let b=bounds(),all=[],page=0;toast('正在准备完整月度数据…');while(true){let {data,error}=await db.from('cash_records').select('date,time,type,amount,summary,remark,partner,category,created_at').gte('date',b.start).lt('date',b.end).order('date').order('created_at').range(page*1000,(page+1)*1000-1);if(error)return toast('导出失败：'+error.message);all.push(...(data||[]));if(!data||data.length<1000)break;page++}let running=Number(S.summary?.opening_balance||0),rows=[];for(let r of all){if(marker(r.summary))continue;running+=r.type==='income'?+r.amount:-r.amount;rows.push({日期:r.date,时间:timeOf(r),类型:r.type==='income'?'收入':'支出',摘要:r.summary,往来单位:r.partner||'',分类:r.category||'',备注:r.remark||'',收入:r.type==='income'?r.amount:0,支出:r.type==='expense'?r.amount:0,余额:running})}if(!rows.length)return toast('本月没有可导出记录');let ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'出纳日记账');XLSX.writeFile(wb,`出纳日记账_${b.y}-${String(b.m).padStart(2,'0')}.xlsx`)}
async function auth(){let email=$('email').value,password=$('password').value,{data,error}=await db.auth.signInWithPassword({email,password});if(error)return toast(error.message);S.user=data.user;closeOverlay('loginOverlay');updateAuth();await loadRules();await refresh();autoOpenNewRecordOnPhone();toast('登录成功')}
async function sendReset(){let email=$('email').value.trim();if(!email)return toast('请先输入登录邮箱');let {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'?reset=1'});if(error)return toast('发送失败：'+error.message);toast('重设邮件已发送，请打开邮箱中的链接')}
async function savePassword(){let p=$('newPassword').value,c=$('confirmPassword').value;if(p.length<8)return toast('新密码至少 8 位');if(p!==c)return toast('两次密码不一致');let {error}=await db.auth.updateUser({password:p});if(error)return toast('保存失败：'+error.message);closeOverlay('resetOverlay');$('newPassword').value='';$('confirmPassword').value='';history.replaceState({},'',location.pathname);toast('新密码已设置，请重新登录')}
function updateAuth(){$('loginBtn').textContent=S.user?(S.user.email||'已登录'):'登录'}
document.addEventListener('click',e=>{let c=e.target.closest('[data-close]');if(c)closeOverlay(c.dataset.close);let im=e.target.closest('.attachment');if(im){S.imageUrls=JSON.parse(im.dataset.images);showProofImage(0);openOverlay('imageOverlay')}let ed=e.target.closest('.edit');if(ed)openRecord(S.records.find(r=>String(r.id)===ed.dataset.id));let de=e.target.closest('.del');if(de)remove(de.dataset.id)})
$('rSummary').addEventListener('input',()=>{let s=suggest($('rSummary').value);if(!$('rPartner').dataset.manual)$('rPartner').value=s.partner;if(!$('rCategory').dataset.manual)$('rCategory').value=s.category});['rPartner','rCategory'].forEach(id=>$(id).addEventListener('input',e=>e.target.dataset.manual='1'));
$('rImages').addEventListener('change',()=>{let files=[...$('rImages').files];if(!files.length)return setImageStatus('');if(files.length>MAX_IMAGES)return setImageStatus(`已选择 ${files.length} 张，一次最多 ${MAX_IMAGES} 张，请重新选择。`,'error');let bad=files.find(f=>!ALLOWED_IMAGE_TYPES.has(f.type)||f.size>MAX_SOURCE_BYTES);if(bad)return setImageStatus(`“${bad.name}”格式不支持或超过 15MB，请重新选择。`,'error');setImageStatus(`已选择 ${files.length} 张，保存时会自动压缩上传。`)});
$('addBtn').onclick=()=>openRecord();$('saveBtn').onclick=()=>save(true);$('saveNextBtn').onclick=()=>save(false);$('loginBtn').onclick=async()=>{if(S.user){if(confirm('要退出当前账号吗？')){await db.auth.signOut();S.user=null;S.records=[];$('rows').innerHTML='';$('empty').style.display='block';$('empty').textContent='请登录查看账本';updateAuth()}}else openOverlay('loginOverlay')};$('doLoginBtn').onclick=auth;$('forgotBtn').onclick=sendReset;$('savePasswordBtn').onclick=savePassword;$('exportBtn').onclick=exportMonth;
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.shiftKey||e.isComposing||e.keyCode===229||e.target.tagName==='TEXTAREA'||e.target.type==='file'||!matchMedia('(hover:hover) and (pointer:fine)').matches||!$('recordOverlay').classList.contains('show'))return;if(['INPUT','SELECT'].includes(e.target.tagName)){e.preventDefault();save(false)}});
document.addEventListener('focusin',keepFocusedFieldVisible);window.addEventListener('resize',syncVisualViewport,{passive:true});window.visualViewport?.addEventListener('resize',()=>{syncVisualViewport();keepFocusedFieldVisible()},{passive:true});window.visualViewport?.addEventListener('scroll',syncVisualViewport,{passive:true});syncVisualViewport();
$('prev').onclick=()=>{if(S.page){S.page--;loadRecords()}};$('next').onclick=()=>{if((S.page+1)*S.pageSize<S.total){S.page++;loadRecords()}};
$('year').onchange=$('month').onchange=()=>{S.page=0;refresh()};$('search').oninput=()=>{clearTimeout(S.timer);S.page=0;S.timer=setTimeout(loadRecords,350)};
$('typeSeg').onclick=e=>{let b=e.target.closest('button');if(!b)return;[...$('typeSeg').children].forEach(x=>x.classList.remove('active'));b.classList.add('active');S.type=b.dataset.type;S.page=0;loadRecords()};
$('scopeSeg').onclick=e=>{let b=e.target.closest('button');if(!b)return;[...$('scopeSeg').children].forEach(x=>x.classList.remove('active'));b.classList.add('active');S.scope=b.dataset.scope;S.page=0;loadRecords()};
window.addEventListener('pageshow',()=>{setTimeout(()=>{let input=$('search');if(input.value){input.value='';S.page=0;if(S.user)loadRecords()}},100)});
(async function init(){let now=new Date();for(let y=2015;y<=now.getFullYear()+1;y++)$('year').add(new Option(y+'年',y,y===now.getFullYear(),y===now.getFullYear()));for(let m=1;m<=12;m++)$('month').add(new Option(m+'月',m,m===now.getMonth()+1,m===now.getMonth()+1));db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')openOverlay('resetOverlay')});let {data:{user}}=await db.auth.getUser();S.user=user;updateAuth();if(S.user){await loadRules();await refresh();autoOpenNewRecordOnPhone()}else{$('empty').style.display='block';$('empty').textContent='请登录查看账本'}})();
</script>
